<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Datos · Supabase</title>
    <meta name="description" content="Formulario web con Supabase y GitHub Pages" />

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- SDK oficial de Supabase (UMD) desde CDN.
         Debe cargarse ANTES que js/supabase.js y js/app.js. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Contenedor de mensajes tipo toast -->
    <div id="mensajes" class="mensajes" aria-live="polite"></div>

    <header class="cabecera">
        <div class="contenedor">
            <h1>Registro de Datos</h1>
            <p class="subtitulo">Formulario conectado a Supabase (PostgreSQL)</p>
            <nav class="nav-paginas" aria-label="Navegación principal">
                <a href="index.html" aria-current="page">Registros</a>
                <a href="comentarios.html">Comentarios</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">

        <!-- ===================== FORMULARIO ===================== -->
        <section class="tarjeta" aria-labelledby="titulo-form">
            <h2 id="titulo-form">Nuevo registro</h2>

            <!-- id oculto usado en modo edición -->
            <input type="hidden" id="registro-id" />

            <form id="formulario" novalidate>

                <div class="grid-campos">
                    <div class="campo">
                        <label for="nombre">Nombre <span class="requerido" aria-hidden="true">*</span></label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ej. Ana García"
                            autocomplete="name"
                            required
                            aria-required="true"
                        />
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="Ej. +52 55 1234 5678"
                            autocomplete="tel"
                        />
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Ej. ana@ejemplo.com"
                            autocomplete="email"
                        />
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            placeholder="Ej. Activo / Pendiente"
                        />
                    </div>

                    <div class="campo campo-completo">
                        <label for="direccion">Dirección</label>
                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            placeholder="Ej. Calle 1 #23, Ciudad"
                            autocomplete="street-address"
                        />
                    </div>

                    <div class="campo campo-completo">
                        <label for="comentarios">Comentarios</label>
                        <textarea
                            id="comentarios"
                            name="comentarios"
                            rows="3"
                            placeholder="Observaciones adicionales..."
                        ></textarea>
                    </div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" id="btn-guardar" class="btn btn-primario">
                        Guardar
                    </button>
                    <button type="button" id="btn-limpiar" class="btn btn-secundario">
                        Limpiar
                    </button>
                    <button type="button" id="btn-cancelar" class="btn btn-ghost oculto">
                        Cancelar edición
                    </button>
                </div>
            </form>
        </section>

        <!-- ===================== LISTADO ===================== -->
        <section class="tarjeta" aria-labelledby="titulo-lista">
            <div class="cabecera-lista">
                <h2 id="titulo-lista">Registros</h2>
                <span id="contador-registros" class="contador">0 registros</span>
            </div>

            <div class="barra-busqueda">
                <label for="buscador" class="sr-only">Buscar registros</label>
                <input
                    type="search"
                    id="buscador"
                    placeholder="Buscar registros por nombre, teléfono o correo..."
                    aria-label="Buscar registros"
                />
            </div>

            <div class="tabla-contenedor">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Dirección</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <!-- Filas generadas por JS -->
                    </tbody>
                </table>

                <p id="sin-registros" class="sin-registros oculto">
                    No hay registros para mostrar.
                </p>
            </div>

            <nav id="paginacion" class="paginacion" aria-label="Paginación"></nav>
        </section>
    </main>

    <!-- Indicador de carga (spinner) -->
    <div id="spinner" class="spinner-overlay oculto" role="status" aria-label="Cargando">
        <div class="spinner"></div>
    </div>

    <!-- Scripts: config -> supabase -> app -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
